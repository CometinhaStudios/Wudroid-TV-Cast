name: Build Wudroid TV Cast

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Wudroid-TV-Cast-Test2-Universal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wudroid-TV-Cast-Test2-Universal
          path: Wudroid-TV-Cast-Test2-Universal.apk
          if-no-files-found: error
